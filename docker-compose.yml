services:
  postgres:
    image: postgres:16-alpine
    container_name: sda-service-request-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sda_service_request
      POSTGRES_USER: sda
      POSTGRES_PASSWORD: sda_password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sda -d sda_service_request"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
