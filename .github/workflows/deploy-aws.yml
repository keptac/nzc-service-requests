name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://sda:sda_password@localhost:5432/sda_service_request?schema=public
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      APP_URL: http://localhost:3000
      UPLOAD_DIR: ./public/uploads
      WHATSAPP_WEBHOOK_TOKEN: ci-only-webhook-token
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  deploy:
    name: Deploy Lightsail stack
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
      LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER }}
      LIGHTSAIL_APP_DIR: ${{ vars.LIGHTSAIL_APP_DIR }}
      LIGHTSAIL_SSH_PORT: ${{ vars.LIGHTSAIL_SSH_PORT || '22' }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}" > ~/.ssh/lightsail_key
          chmod 600 ~/.ssh/lightsail_key
          ssh-keyscan -p "$LIGHTSAIL_SSH_PORT" "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on Lightsail
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lightsail_key -p "$LIGHTSAIL_SSH_PORT" "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "APP_DIR='$LIGHTSAIL_APP_DIR' BRANCH='${GITHUB_REF_NAME}' SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --ff-only origin "$BRANCH"
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$SHA" ]; then
            echo "Warning: deployed HEAD $CURRENT_SHA differs from workflow SHA $SHA"
          fi
          docker compose \
            -f deploy/aws/docker-compose.low-cost.yml \
            --env-file deploy/aws/lightsail.env \
            up -d --build
          docker compose \
            -f deploy/aws/docker-compose.low-cost.yml \
            --env-file deploy/aws/lightsail.env \
            ps
          docker image prune -f
          REMOTE
